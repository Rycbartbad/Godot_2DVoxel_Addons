name: build-addon

## 生成物不进仓库（见 .gitignore）：addons/pixel_destruction/ 是构建产物。
## 仓库里只有真源 src/ + gdext/ 和手写模板 addon_src/。
## 这个 workflow 负责构建、校验、打包，并在打 tag 时发布 Release。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ⚠️ 构建 -> 校验 -> **自动移出项目树**，一条命令走完。
      #
      # 为什么必须移出：addon 的 class_name 与 src/ 必然重名，住在项目树里会让
      # 编辑器报 "Class X hides a global script class" 并级联到编译失败。
      # .gdignore 挡不住（只要有一个文件被加载，类就全局注册了）。
      #
      # 而 check_addon.py 又必须能在树内看到产物 —— 所以顺序不能拆开写，
      # 让每个调用方自己记是不现实的（本地就在这上面翻过车）。--verify 固化了这个顺序。
      - name: 构建 addon（构建 -> 自检 -> 移出项目树）
        run: python tools/build_addon.py --verify

      - name: 二次构建必须完全一致（生成器要幂等）
        run: |
          cp -r ../_addon_build /tmp/first
          python tools/build_addon.py --verify
          diff -r /tmp/first ../_addon_build
          echo "幂等 OK"

      - name: 打包
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python tools/package_addon.py --version "${GITHUB_REF_NAME}"
          else
            python tools/package_addon.py
          fi
          ls -l pixel_destruction*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pixel_destruction-addon
          path: pixel_destruction*.zip
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pixel_destruction*.zip
          generate_release_notes: true

  ## API 参考：用 Godot 自带的 --doctool --gdscript-docs 导出结构，
  ## 再由 tools/gen_api_docs.py 拼成 Markdown（结构取自 XML，排版取自原始注释）。
  docs:
    runs-on: ubuntu-latest
    if: ${{ vars.GODOT_VERSION != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 下载 Godot
        run: |
          set -e
          V="${{ vars.GODOT_VERSION }}"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}-stable_linux.x86_64" godot
          chmod +x godot

      - name: 生成 API 参考
        env:
          GODOT_BIN: ./godot
        run: python tools/gen_api_docs.py

      - name: 文档覆盖率写进任务摘要
        run: cat docs/api/_coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api
          if-no-files-found: error

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/api

      - uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
        id: deployment

  ## 引擎回归：跑 Godot 无头测试。
  ## Godot 版本由仓库变量 GODOT_VERSION 控制，没设就跳过 ——
  ## 不让 CI 因为一个下载地址失效而长期红着（红着的 CI 等于没有 CI）。
  engine-tests:
    runs-on: ubuntu-latest
    if: ${{ vars.GODOT_VERSION != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot
        run: |
          set -e
          V="${{ vars.GODOT_VERSION }}"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}-stable_linux.x86_64" godot
          chmod +x godot

      # ⚠️ 这个 job **在树内**构建 addon（不用 --verify）。
      #
      # 为什么可以放树里：class_name 重名只在**编辑器**里致命（脚本重载路径），
      # 而这里跑的是 headless —— 实测 addon 在树里时 290 项断言照样全过。
      # 必须放树里的理由：check_manual_api.gd 要 preload/load addon 的脚本，
      # 而 ../_addon_build 在 res:// 之外，load() 够不着。
      #
      # 不构建的话，那个检查会"缺席即跳过"—— 看起来是绿的，实际空转。
      - name: 构建 addon（树内，供手册 API 检查用）
        run: python tools/build_addon.py

      - name: 单元断言
        run: |
          set -e
          for t in test_core test_physics test_interaction test_parallel; do
            ./godot --headless --path . --script "res://tests/${t}.gd" | tee /tmp/out
            grep -q "0 failed" /tmp/out
          done

      - name: 逐位回归基准
        run: ./godot --headless --path . --script res://tests/dump_state.gd

      - name: 物理与接口验证
        run: |
          set -e
          for t in validation_sweep validation_query validation_api validation_api2 \
                   validation_voxel_layer validation_contacts validation_traversal; do
            ./godot --headless --path . --script "res://tests/${t}.gd" | tee /tmp/out
            grep -q "0 failed" /tmp/out
          done

      ## 教错 API 的手册比没有手册更糟 —— 把手册里提到的每个方法/属性
      ## 拿去和真实代码对一遍。
      - name: 手册引用的 API 必须真实存在
        run: ./godot --headless --path . --script res://tests/check_manual_api.gd | tee /tmp/man
        # 检查脚本现在会在 addon 缺席时**失败**（CI 环境下），
        # 不会再有"跳过然后 exit 0"这种看起来是绿的空转。

